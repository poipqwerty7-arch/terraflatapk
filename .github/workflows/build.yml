name: Create New Terraflat Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-key:
    runs-on: ubuntu-22.04

    steps:
      - name: Generate new signing key
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/signing/release.keystore" \
            -storetype PKCS12 \
            -storepass "TerraflatNewKey2026!" \
            -keypass "TerraflatNewKey2026!" \
            -alias terraflat \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Terraflat, O=Terraflat, C=RU"

          echo "New signing key created."

      - name: Upload new signing key
        uses: actions/upload-artifact@v4
        with:
          name: Terraflat-NEW-SIGNING-KEY
          path: ${{ runner.temp }}/signing/release.keystore
          retention-days: 1
