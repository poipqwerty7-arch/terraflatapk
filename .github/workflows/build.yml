name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Генерация ключа подписи (для RuStore)
        run: |
          keytool -genkey -v -keystore mygame.keystore -alias mygame_alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "SuperSecretPass123" -keypass "SuperSecretPass123" \
            -dname "CN=Terraflat, O=Developer, C=RU"

      - name: Установка зависимостей Python и принятие лицензий Android
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          
          # Настраиваем окружение Android
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # Исправлено: используем правильный синтаксис команды android-licenses через дефис
          yes | buildozer android-licenses

      - name: Buildozer Сборка
        env:
          BUILDOZER_SECRET_KEYSTORE: mygame.keystore
          BUILDOZER_SECRET_KEYSTORE_PASSWORD: SuperSecretPass123
          BUILDOZER_SECRET_KEY_ALIAS: mygame_alias
          BUILDOZER_SECRET_KEY_PASSWORD: SuperSecretPass123
        run: |
          # Собираем РЕЛИЗНУЮ версию
          buildozer -v android release

      - uses: actions/upload-artifact@v4
        with:
          name: terraflat-release-apk
          path: bin/*.apk
